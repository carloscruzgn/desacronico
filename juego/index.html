<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>desacrónico</title>
<link rel="stylesheet" href="estilos.css">
</head>
<body>

<!-- INICIO -->
<section id="inicio" class="pantalla activa">
  <div class="portada">
    <h1 class="logo-juego"><span class="des">des</span><span class="a">a</span><span class="cronico">crónico</span></h1>
    <p class="lema">un juego de cartas para hacer cronologías</p>
    <nav class="menu">
      <button data-modo="clasico">Modo competitivo tradicional</button>
      <button data-modo="eras">Modo competitivo de eras</button>
      <button data-modo="cooperativo">Modo cooperativo</button>
      <hr>
      <button data-ir="explorar" class="secundario">Ver las cartas</button>
      <button data-ir="reglas" class="secundario">Reglamento</button>
      <button data-ir="creditos" class="secundario">Créditos</button>
    </nav>
    <p class="autores">Carlos Cruz González · Rodrigo Muñoz Martínez<br>CEPA de Coria</p>
  </div>
</section>

<!-- PREPARACIÓN -->
<section id="preparar" class="pantalla">
  <header class="barra"><button class="volver" data-ir="inicio">← Inicio</button><h2 id="prep-titulo"></h2></header>
  <div class="contenido estrecho">
    <h3>Mazo</h3>
    <p class="ayuda">Puede utilizarse uno de los ámbitos temáticos o cualquier mezcla de ellos.</p>
    <div id="prep-ambitos" class="ambitos"></div>
    <p id="prep-mazo" class="ayuda"></p>
    <h3>Jugadores</h3>
    <div class="fila">
      <label>Número de jugadores <select id="prep-num"></select></label>
    </div>
    <div id="prep-nombres" class="nombres"></div>
    <p id="prep-error" class="error"></p>
    <button id="prep-empezar" class="grande">Empezar la partida</button>
  </div>
</section>

<!-- MESA -->
<section id="mesa" class="pantalla">
  <header class="barra">
    <button class="volver" id="mesa-salir">← Salir</button>
    <h2 id="mesa-titulo"></h2>
    <div class="estado" id="mesa-estado"></div>
    <label class="tam" title="Tamaño de las cartas">Tamaño <input type="range" id="tam-cartas" min="70" max="220" value="120"></label>
  </header>
  <div id="mesa-cuerpo"></div>
</section>

<!-- EXPLORAR -->
<section id="explorar" class="pantalla">
  <header class="barra"><button class="volver" data-ir="inicio">← Inicio</button><h2>Las cartas</h2>
    <label class="tam">Tamaño <input type="range" id="tam-explorar" min="80" max="260" value="150"></label>
  </header>
  <div class="contenido">
    <div class="filtros">
      <div id="filtro-ambitos" class="ambitos"></div>
      <div class="fila">
        <label>Era <select id="filtro-era"><option value="">Todas</option></select></label>
        <label>Orden <select id="filtro-orden"><option value="impresion">Como en la impresión</option><option value="crono">Cronológico</option></select></label>
        <label>Buscar <input type="search" id="filtro-texto" placeholder="Texto de la carta"></label>
        <label class="check"><input type="checkbox" id="filtro-reverso"> Mostrar el reverso</label>
      </div>
      <p id="filtro-cuenta" class="ayuda"></p>
    </div>
    <div id="rejilla" class="rejilla"></div>
  </div>
</section>

<!-- REGLAS -->
<section id="reglas" class="pantalla">
  <header class="barra"><button class="volver" data-ir="inicio">← Inicio</button><h2>Reglamento</h2></header>
  <div class="contenido estrecho texto" id="reglas-texto"></div>
</section>

<!-- CRÉDITOS -->
<section id="creditos" class="pantalla">
  <header class="barra"><button class="volver" data-ir="inicio">← Inicio</button><h2>Créditos</h2></header>
  <div class="contenido estrecho texto" id="creditos-texto"></div>
</section>

<!-- VENTANA DE CARTA AMPLIADA / AVISOS -->
<div id="velo" class="velo oculto">
  <div class="ventana" id="ventana"></div>
</div>

<script src="datos.js"></script>
<script src="textos.js"></script>
<script src="juego.js"></script>
</body>
</html>
